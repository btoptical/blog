   <text style="fill: #172b3a; font: 9px 'DejaVu Sans'; text-anchor: start" x="79.2" y="438.48" transform="rotate(-0 79.2 438.48)">Revenue = equity valuation / nominal IPO equity-to-TTM-revenue multiple. No regression is fitted.</text>
  </g>
  <g id="text_27">
   <text style="fill: #172b3a; font: 9px 'DejaVu Sans'; text-anchor: start" x="79.2" y="453.6" transform="rotate(-0 79.2 453.6)">Historical values use basic post-offering shares. Private financing terms and diluted share counts are not standardized.</text>
  </g>
  <g id="text_28">
   <text style="fill: #172b3a; font: 9px 'DejaVu Sans'; text-anchor: start" x="79.2" y="468.72" transform="rotate(-0 79.2 468.72)">No cash adjustment, return hurdle, or future revenue date is assumed. Sources and sensitivities accompany the article.</text>
  </g>
 </g>
