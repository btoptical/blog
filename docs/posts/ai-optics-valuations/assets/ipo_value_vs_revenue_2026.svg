  <g id="text_27">
   <text style="fill: #596a79; font: 8.1px 'DejaVu Sans'; text-anchor: start" x="60.48" y="472.32" transform="rotate(-0 60.48 472.32)">Revenue: latest disclosed trailing 12 months before IPO; full year minus prior interim plus current interim.</text>
  </g>
  <g id="text_28">
   <text style="fill: #596a79; font: 8.1px 'DejaVu Sans'; text-anchor: start" x="60.48" y="487.296" transform="rotate(-0 60.48 487.296)">Valuation: IPO offer price × post-offering basic shares; excludes the underwriters’ additional-share option and unissued awards.</text>
  </g>
  <g id="text_29">
   <text style="fill: #596a79; font: 8.1px 'DejaVu Sans'; text-anchor: start" x="60.48" y="502.272" transform="rotate(-0 60.48 502.272)">Both coordinates use IPO-month CPI, preserving nominal revenue multiples; July 2026 CPI-U = 333.918.</text>
  </g>
  <g id="text_30">
   <text style="fill: #596a79; font: 8.1px 'DejaVu Sans'; text-anchor: start" x="60.48" y="517.248" transform="rotate(-0 60.48 517.248)">Infinera deferred substantial bundled-product revenue. Its GAAP-revenue multiple does not measure its shipment-value multiple.</text>
  </g>
  <g id="text_31">
   <text style="fill: #596a79; font: 8.1px 'DejaVu Sans'; text-anchor: start" x="60.48" y="532.224" transform="rotate(-0 60.48 532.224)">Dashed lines show constant valuation/revenue ratios, not a fitted relationship. Three observations do not establish a valuation model.</text>
  </g>
