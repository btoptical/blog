project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
  resources:
    - images

website:
  title: "Infinite Limit"
  description: "Notes and essays on AI infrastructure, systems architecture, scaling, and physical limits."
  site-url: https://infinitelimit.ai
  favicon: images/logo-square.svg
  open-graph: true
  twitter-card: true
  llms-txt: true

  page-footer:
    center: |
      © 2026 Brian Taylor ·
      <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>

  navbar:
    title: false
    background: light
    foreground: dark
    search: false
    logo: images/logo-navbar.svg
    logo-alt: "Infinite Limit"
    logo-href: /
    left:
      - href: /
        text: Writing
      - href: about.qmd
        text: About
    right:
      - href: contact.qmd
        text: Contact
    tools:
      - icon: rss
        href: index.xml
        aria-label: RSS feed

format:
  html:
    css:
      - styles.css
      - print.css
    theme:
      light: default
      dark: darkly
    fontsize: 1.05em
    linestretch: 1.6
    toc: false
